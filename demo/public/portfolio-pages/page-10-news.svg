<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650"><rect width="1200" height="1650" fill="#f5f1e8"/><text x="84" y="104" class="eyebrow">新闻作品</text><path d="M84 132H1116" stroke="#252c27" stroke-opacity=".28"/><text x="84" y="340" class="title" font-size="72">从现场，到报道</text><text x="84" y="450" class="small">观察、采访与采写，让信息回到真实的人和事。</text><path d="M84 650H1116M84 940H1116M84 1230H1116" stroke="#c7c0b3" stroke-width="2"/><text x="84" y="590" class="tag" font-size="24">01</text><text x="190" y="590" class="body" font-size="38">观察现场</text><text x="190" y="650" class="small" font-size="22">从具体的人物与环境出发，记录现场细节。</text><text x="84" y="880" class="tag" font-size="24">02</text><text x="190" y="880" class="body" font-size="38">采访核实</text><text x="190" y="940" class="small" font-size="22">倾听当事人的讲述，核对事实与信息来源。</text><text x="84" y="1170" class="tag" font-size="24">03</text><text x="190" y="1170" class="body" font-size="38">采写编辑</text><text x="190" y="1230" class="small" font-size="22">梳理材料、准确表达，让报道清楚抵达读者。</text><text x="84" y="1575" class="foot">季玉静  ·  河南大学新闻学</text><text x="1116" y="1575" text-anchor="end" class="foot">08</text><style>.eyebrow,.foot{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;font-size:19px;letter-spacing:4px;fill:#73776d}.title{font-family:'Noto Serif SC','Songti SC',serif;font-size:72px;font-weight:400;letter-spacing:-2px;fill:#252c27}.body{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;font-size:29px;fill:#454a43}.small{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;font-size:21px;fill:#6e7268}.tag{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;font-size:19px;letter-spacing:2px;fill:#657467}</style></svg>